pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://repo.william278.net/releases' }
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net' }
        maven { url 'https://repo.essential.gg/repository/maven-public' }
    }

    plugins {
        def egtVersion = "0.6.5"
        id("gg.essential.defaults") version egtVersion
        id("gg.essential.multi-version.root") version egtVersion
    }
}

// Common
rootProject.name = 'HuskSync'
include("common")

// Bukkit
include("bukkit")
project(":bukkit").with {
    projectDir = file("bukkit/")
    buildFileName = "root.gradle"
}

def allowedBukkitVersions = ["1.20.1"] as Set
file('bukkit').listFiles((FileFilter) ((File file) ->
        file.isDirectory() && file.name ==~ /(\d+)\.(\d+)(\.(\d+))?/ && allowedBukkitVersions.contains(file.name)
)).each {
    include("bukkit:$it.name")
    project(":bukkit:$it.name").with {
        projectDir = file("bukkit/${it.name}")
        buildFileName = '../build.gradle'
    }
}

// Fabric (excluded for this build)
